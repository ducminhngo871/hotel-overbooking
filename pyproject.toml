[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["notebooks", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["hotel_ob", "common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning", "ignore::FutureWarning"]
